<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi cuenta | NEST IB SUPPORT</title><link rel="stylesheet" href="css/app.css"><style>.auth-container{max-width:510px;margin:56px auto 90px}.auth-container form .field{margin:14px 0}.auth-container input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text)}.auth-container .auth-actions{display:flex;gap:10px;flex-wrap:wrap}.auth-container .auth-actions button{flex:1}.auth-container #btnMostrarRegistro{margin-top:12px}.auth-container #panelUsuario input{margin-bottom:12px}.auth-container #panelUsuario button{margin:8px 0}.auth-container .back-link{border-top:1px solid var(--line);padding-top:22px;margin-top:22px;text-align:center}.auth-container #mensaje{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--primary2);font-size:13px}</style></head><body><div id="site-header"></div><main class="wrap"><div class="panel auth-container"><h1 style="text-align:center;font-size:34px;margin:10px 0 4px">Mi cuenta</h1><p class="muted" style="text-align:center">Crea y conserva tu espacio de estudio 💜</p><form id="formAuth"><div id="campoNickname" hidden><label class="field"><span>Nombre o seudónimo</span><input id="nickname" minlength="3" maxlength="30" autocomplete="nickname" placeholder="IB_Explorer"></label></div><label class="field"><span>Correo electrónico</span><input id="email" type="email" autocomplete="email" required></label><label class="field"><span>Contraseña</span><input id="password" type="password" minlength="8" autocomplete="current-password" required></label><div class="auth-actions"><button class="btn" type="submit" id="btnLogin">Iniciar sesión</button><button class="btn ghost" type="button" id="btnRegistro">Crear cuenta</button></div></form><button class="btn sm ghost" type="button" id="btnMostrarRegistro">Registrarme con un seudónimo</button><section id="panelUsuario" hidden><h2>Sesión iniciada</h2><p id="usuarioActual"></p><h3>Mi perfil</h3><label class="field"><span>Nombre o seudónimo</span><input id="editarNickname" minlength="3" maxlength="30" placeholder="Tu seudónimo"></label><button class="btn" id="btnGuardarNickname" type="button">Guardar nombre</button><div><button class="btn ghost" type="button" id="btnSalir">Cerrar sesión</button></div></section><p id="mensaje" role="status" aria-live="polite"></p><div class="back-link"><a class="btn ghost" href="index.html">← Volver a la página principal</a></div></div></main><div id="site-footer"></div><script src="config.js"></script><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="js/account-shell.js"></script><script defer src="auth.js"></script></body></html>
